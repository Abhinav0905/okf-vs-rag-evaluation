[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-trial-data"
version = "0.1.0"
description = "Reproducible OKF v0.2 bundle production and retrieval for the WMP RAG benchmark"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
analysis = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
]
paper = [
    "pdfplumber>=0.11",
    "pypdf>=5",
    "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

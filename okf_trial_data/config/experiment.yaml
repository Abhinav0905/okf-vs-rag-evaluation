experiment:
  id: okf_wmp_paired_v2
  title: "Open Knowledge Format as a Retrieval Substrate for RAG"
  seed: 42
  benchmark: data/benchmark_questions.json
  corpus: PGE
  question_count: 93
  preregistered_primary_outcome: answer_correctness

okf:
  version: "0.2"
  specification_url: "https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/3fcbb9f828c2f23d109c855ee403c3a4c81f3a96/okf/SPEC.md"
  specification_commit: "3fcbb9f828c2f23d109c855ee403c3a4c81f3a96"
  producer: "okf_trial_data/0.1.0"
  generated_at: "2026-08-02T00:00:00Z"
  bundles_dir: data/okf_bundles

systems:
  - simple_rag
  - reranked_simple
  - agentic_rag
  - self_rag
  - flare

conditions:
  raw_vector:
    description: "Existing pgvector dense retrieval, with each system's normal reranking/control logic."
  okf_hybrid:
    description: "The same vector seeds augmented by deterministic OKF metadata and link traversal."

secondary_retrieval_conditions:
  - raw_vector
  - okf_native
  - okf_hybrid

exploratory_end_to_end:
  enabled: true
  condition: okf_native
  expected_additional_records: 465
  analysis_status: exploratory
  rationale: >-
    A pre-paid retrieval screen on the superseded v1 benchmark showed materially
    higher expected-page recall for the frozen OKF-native consumer. Answer
    generation remains included to estimate whether that signal transfers
    downstream, but selection of this arm was data-motivated and it is not part
    of the confirmatory raw-vector versus OKF-hybrid hypothesis family.

models:
  answer_generator: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  evaluator: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  region: us-west-2
  temperature: 0.0

retrieval:
  top_k: 10
  overfetch_k: 25
  context_token_budget: 2200
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  okf_seed_fraction: 0.5
  okf_link_hops: 1
  okf_link_decay: 0.35
  okf_bidirectional_links: true

evaluation:
  judge_trials: 3
  parse_retries: 2
  fail_closed: true
  no_neutral_imputation: true
  blind_condition_labels: true
  minimum_complete_pair_rate: 1.0
  maximum_parse_failure_rate: 0.0

statistics:
  alpha: 0.05
  bootstrap_iterations: 10000
  confidence_level: 0.95
  paired_test: wilcoxon_signed_rank
  multiplicity_correction: holm
  correction_family: five_system_primary_comparisons

scope:
  # An in-house pipeline is withheld from this study and is not part of the
  # public artifact. The evaluator rejects any record carrying this identifier
  # so it cannot enter results by accident.
  excluded_systems:
    - ear
  historical_results_role: sanity_check_only
